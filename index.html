    <!--
      Applies the stored accessibility preferences before the first paint, so a visitor who chose
      the light theme or a larger text size never sees a frame of the default dark one. This is a
      hand-rolled mirror of applyPreferences() in src/lib/a11y/preferences.ts — keep the two in
      sync; the data attributes are the contract main.css styles against.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var scales = {sm: 0.875, md: 1, lg: 1.15, xl: 1.3};
        var stored = {};

        try {
          stored = JSON.parse(localStorage.getItem('fs:a11y') || '{}') || {};
        } catch (error) {
          /* Storage unavailable or malformed — the defaults below still render a usable page. */
        }

        var media = function (query) {
          return typeof matchMedia === 'function' && matchMedia(query).matches;
        };
        var pick = function (value, allowed, fallback) {
          return allowed.indexOf(value) === -1 ? fallback : value;
        };

        var theme = pick(stored.theme, ['light', 'dark', 'system', 'daltonism'], 'system');
        var motion = pick(stored.motion, ['system', 'full', 'reduced'], 'system');
        var scale = pick(stored.fontScale, ['sm', 'md', 'lg', 'xl'], 'md');

        root.dataset.fsTheme = theme === 'system'
          ? (media('(prefers-color-scheme: dark)') ? 'dark' : 'light')
          : theme;
        root.dataset.fsMotion = motion === 'system'
          ? (media('(prefers-reduced-motion: reduce)') ? 'reduced' : 'full')
          : motion;
        root.dataset.fsFontScale = scale;
        root.dataset.fsCursor = pick(stored.cursor, ['drop', 'system'], 'drop');
        root.dataset.fsContrast = stored.highContrast === true ? 'high' : 'normal';
        root.dataset.fsLinks = stored.underlineLinks === true ? 'underlined' : 'default';
        root.dataset.fsSpacing = stored.readableSpacing === true ? 'readable' : 'default';
        root.style.setProperty('--fs-font-scale', String(scales[scale]));
        if (stored.language === 'es' || stored.language === 'en') root.lang = stored.language;
      })();
    </script>
